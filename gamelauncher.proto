syntax = "proto3";

package gamelauncher;

service GameService
{
	rpc CheckVersion (VersionRequest) returns (VersionResponse);

	rpc DownloadGame (DownloadRequest) returns (stream GameData);

	rpc GetGameManifest (DownloadRequest) returns (GameManifest);

	rpc DownloadGameFiles (GameFilesRequest) returns (stream GameFileData);

	rpc WaitUpdate (Identificial) returns (stream UpdateNotice);

	rpc ListComments (CommentListRequest) returns (CommentListResponse);

	rpc AddComment (AddCommentRequest) returns (Comment);
}

message VersionRequest
{
	string game_id = 1;
	string current_version = 2;
}

message VersionResponse
{
	string latest_version = 1;
	bool is_update_available = 2;
}

message DownloadRequest
{
	string game_id = 1;
	string version = 2;
}

message GameData
{
	bytes data = 1;
	int32 index = 2;
}

message GameManifest
{
	string game_id = 1;
	string version = 2;
	repeated GameFile files = 3;
	uint64 archive_size = 4;
}

message GameFile
{
	string path = 1;
	uint64 size = 2;
	string sha256 = 3;
}

message GameFilesRequest
{
	string game_id = 1;
	string version = 2;
	repeated string paths = 3;
}

message GameFileData
{
	string path = 1;
	bytes data = 2;
	uint64 offset = 3;
	bool complete = 4;
}

message Identificial
{
	string ip_addr = 1;
	repeated string installed_game_ids = 2;
}

message UpdateNotice
{
	string game_id = 1;
	string version = 2;
	UpdateAction action = 3;
}

enum UpdateAction
{
	UPSERT = 0;
	DELETE = 1;
}

message CommentListRequest
{
	string game_id = 1;
}

message CommentListResponse
{
	repeated Comment comments = 1;
}

message AddCommentRequest
{
	string game_id = 1;
	string author = 2;
	string content = 3;
}

message Comment
{
	string id = 1;
	string game_id = 2;
	string author = 3;
	string content = 4;
	int64 created_at = 5;
}
